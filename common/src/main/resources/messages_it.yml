prefix: "&#FF8A1F&lSINTESI &8» &7"
kick:
  passed:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#7CFC8AVerifica completata."
    - "&7Riconnettiti per entrare nel server."
  failed:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CVerifica non riuscita."
    - "&7Attendi un momento e riprova."
  busy:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FFD447Qualcuno sulla tua connessione è in verifica in questo momento."
    - "&7Riprova tra qualche secondo."
  overloaded:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FFD447Il server si sta difendendo da un attacco di bot."
    - "&7Riprova tra qualche secondo."
  flood-blocked:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CAbbiamo rilevato un numero anomalo di connessioni dal tuo indirizzo IP."
    - "&7Il tuo indirizzo IP è stato bloccato per &f{minutes} &7minuti."
    - ""
    - "&7Se pensi che sia un errore, contatta gli amministratori del server"
    - "&7e comunica loro questo codice: &f#SINTESI-{code}"
  vpn-blocked:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CLe connessioni tramite VPN, proxy o hosting non sono consentite in questo momento."
    - "&7Disattiva la VPN o il proxy e riprova."
  too-many-accounts:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CCi sono già troppi giocatori online dalla tua connessione."
    - "&7Attendi che uno di loro esca."
  unsupported:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CQuesta versione del gioco non può essere verificata."
    - "&7Entra con una versione supportata."
state:
  normal: "&#7CFC8ANormale"
  elevated: "&#FFD447Elevato"
  attack: "&#FF5C5CSotto attacco"
verbose:
  actionbar: "&#FF8A1F&lSINTESI &8| &7CPS &f{cps} &8| &7Accessi &f{joins}/s &8| &7In verifica &f{verifying} &8| &7Passati &#7CFC8A{passed}/s &8| &7Falliti &#FF5C5C{failed}/s &8| &7Bloccati &f{blocked}/s &8| {state}"
  enabled: "{prefix}Statistiche in tempo reale &#7CFC8Aattivate&7."
  disabled: "{prefix}Statistiche in tempo reale &#FF5C5Cdisattivate&7."
notify:
  title: "&#FF8A1F&lSINTESI"
  subtitle: "&7Sintesi sta bloccando un attacco di bot &8(&f{cps} &7cps, &f{blocked} &7bloccate/s, &f{failed} &7fallite/s&8)"
  started: "{prefix}&#FF5C5CAttacco di bot rilevato&7: &f{cps} &7connessioni al secondo."
  ended: "{prefix}&#7CFC8AAttacco terminato &7dopo &f{duration}&7. Picco &f{peak} &7cps, &f{total_blocked} &7connessioni bloccate, &f{total_failed} &7verifiche fallite."
  enabled: "{prefix}Notifiche degli attacchi &#7CFC8Aattivate&7."
  disabled: "{prefix}Notifiche degli attacchi &#FF5C5Cdisattivate&7."
webhook:
  started: "**Attacco di bot rilevato**: {cps} connessioni al secondo. Sintesi lo sta filtrando."
  ended: "**Attacco terminato** dopo {duration}. Picco di {peak} connessioni al secondo, {total_blocked} connessioni bloccate, {total_failed} verifiche fallite, {total_passed} giocatori verificati."
update:
  available: "{prefix}&fSintesi {latest} &7è disponibile, stai usando la &f{current} &8(&f{behind} &7più recenti sul canale &f{channel}&8)&7. &b{url}"
stats:
  - "&8&m                                                  "
  - "&#FF8A1F&lSINTESI &7statistiche &8(&7attivo da &f{uptime}&8)"
  - ""
  - " &7Stato: {state}"
  - " &7Connessioni: &f{cps}&7/s &8(&7picco &f{peak}&8)"
  - " &7Accessi: &f{joins}&7/s  &7Ping: &f{pings}&7/s"
  - " &7In verifica ora: &f{verifying}"
  - " &7Verifiche: &#7CFC8A{total_passed} passate &8/ &#FF5C5C{total_failed} fallite"
  - " &7Connessioni bloccate: &f{total_blocked}"
  - " &7Giocatori verificati salvati: &f{stored}"
  - " &7Connessioni Bedrock (Geyser, non controllate): &f{bedrock}"
  - " &7Accessi VPN rifiutati: &f{vpn_refused}"
  - " &7Indirizzi bloccati: &f{blocklisted}"
  - " &7Protocolli supportati: &f{protocols}"
  - " &7Ultimo fallimento: &f{last_failure}"
  - " &7Memoria: &f{memory_used} &8/ &f{memory_max} &7MB"
  - "&8&m                                                  "
command:
  help-header:
    - "&8&m                                                  "
    - "&#FF8A1F&lSINTESI &7antibot &8(&7v{version}&8)"
    - ""
  help-line: " &#FF8A1F/sintesi {command} &8» &7{description}"
  help-footer: "&8&m                                                  "
  no-permission: "{prefix}&#FF5C5CNon hai il permesso per farlo."
  players-only: "{prefix}&#FF5C5CSolo i giocatori possono usare questo comando."
  unknown: "{prefix}Sottocomando sconosciuto. Usa &#FF8A1F/sintesi help&7."
  usage: "{prefix}Uso: &#FF8A1F/sintesi {usage}"
  reloaded: "{prefix}Configurazione e messaggi &#7CFC8Aricaricati&7."
  reload-failed: "{prefix}&#FF5C5CRicaricamento non riuscito: &7{error}"
  invalid-address: "{prefix}&#FF5C5C{address} &7non è un indirizzo IP valido."
  blocklist-added: "{prefix}Bloccato &f{address} &7per &f{minutes} &7minuti."
  blocklist-removed: "{prefix}Sbloccato &f{address}&7."
  blocklist-cleared: "{prefix}Rimossi &f{count} &7indirizzi bloccati."
  blocklist-size: "{prefix}&f{count} &7indirizzi sono bloccati."
  blocklist-help:
    - "{prefix}Comandi della blocklist:"
    - " &#FF8A1F/sintesi blocklist remove <ip|codice> &8» &7toglie un blocco, il codice è quello mostrato al giocatore (#SINTESI-XXXXXX)"
    - " &#FF8A1F/sintesi blocklist info <ip|codice> &8» &7indirizzo, motivo e tempo rimasto"
    - " &#FF8A1F/sintesi blocklist add <ip> [minuti] &8» &7blocca un indirizzo"
    - " &#FF8A1F/sintesi blocklist clear &8» &7toglie tutti i blocchi"
  blocklist-info: "{prefix}&f{address} &7è bloccato per altri &f{minutes} &7minuti &8(&7{reason}&8, &7codice &f#SINTESI-{code}&8)"
  blocklist-not-found: "{prefix}&f{target} &7non è bloccato."
  blocklist-unknown-address: "indirizzo sconosciuto"
  blocklist-reason-manual: "aggiunto dallo staff"
  blocklist-reason-failures: "verifiche fallite ripetute"
  blocklist-reason-flood: "flood di connessioni"
  verified-cleared: "{prefix}Rimossi &f{count} &7giocatori verificati. Tutti verranno verificati di nuovo."
  verified-count: "{prefix}&f{count} &7giocatori verificati salvati."
  verified-removed: "{prefix}&f{name} &7verrà verificato di nuovo al prossimo accesso."
  verified-not-found: "{prefix}&f{name} &7non era verificato da quell'indirizzo."
  vpn-status: "{prefix}Blocco VPN in modalità &f{mode}&7, &f{ranges} &7intervalli caricati, &f{refused} &7accessi rifiutati."
  vpn-listed: "{prefix}&f{address} &7è nelle liste di VPN, proxy o hosting e verrebbe rifiutato."
  vpn-not-listed: "{prefix}&f{address} &7non è nelle liste di VPN, proxy o hosting."
  vpn-unknown-target: "{prefix}&f{target} &7non è né un indirizzo IP né un giocatore online."
  vpn-reloading: "{prefix}Scarico di nuovo le liste VPN. Il risultato viene scritto in console."
  version-up-to-date: "{prefix}Sintesi &f{current} &7è l'ultima versione sul canale &f{channel}&7."
  version-outdated: "{prefix}&fSintesi {latest} &7è disponibile, stai usando la &f{current}&7. &b{url}"
  version-unknown: "{prefix}Sintesi &f{current}&7. Modrinth non è raggiungibile, riprova più tardi."
  version-disabled: "{prefix}Sintesi &f{current}&7. Il controllo degli aggiornamenti è disattivato in config.yml."
  version-checking: "{prefix}Controllo gli aggiornamenti su Modrinth."
  player-offline: "{prefix}&f{name} &7non è online. Usa &#FF8A1F/sintesi verified remove <nome> <ip>&7."
description:
  help: "Mostra questo aiuto"
  stats: "Mostra le statistiche dettagliate"
  verbose: "Attiva o disattiva le statistiche nella action bar"
  notify: "Attiva o disattiva le notifiche degli attacchi"
  reload: "Ricarica config.yml e messages.yml"
  blocklist: "Gestisci gli indirizzi bloccati, togli un blocco con /sintesi blocklist remove <ip|codice>"
  verified: "Gestisci i giocatori verificati (count, clear, remove)"
  vpn: "Stato del blocco VPN, controlla un indirizzo, scarica di nuovo le liste"
  version: "Mostra la versione e controlla gli aggiornamenti su Modrinth"
