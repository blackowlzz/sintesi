prefix: "&#FF8A1F&lSINTESI &8» &7"
kick:
  passed:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#7CFC8AVerification complete."
    - "&7Please reconnect to join the server."
  failed:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CVerification failed."
    - "&7Please wait a moment and try again."
  busy:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FFD447Someone on your connection is being verified right now."
    - "&7Please try again in a few seconds."
  overloaded:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FFD447The server is protecting itself from a bot attack."
    - "&7Please try again in a few seconds."
  flood-blocked:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CWe detected an unusual number of connections from your IP address."
    - "&7Your IP address has been blocked for &f{minutes} &7minutes."
    - ""
    - "&7If you think this is a mistake, contact the server administrators"
    - "&7and give them this code: &f#SINTESI-{code}"
  vpn-blocked:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CConnections through a VPN, proxy or hosting provider are not allowed right now."
    - "&7Please turn off your VPN or proxy and try again."
  too-many-accounts:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CToo many players are already online from your connection."
    - "&7Please wait until one of them leaves."
  unsupported:
    - "&#FF8A1F&lSINTESI"
    - ""
    - "&#FF5C5CThis game version cannot be verified."
    - "&7Please join with a supported version."
state:
  normal: "&#7CFC8ANormal"
  elevated: "&#FFD447Elevated"
  attack: "&#FF5C5CUnder attack"
verbose:
  actionbar: "&#FF8A1F&lSINTESI &8| &7CPS &f{cps} &8| &7Joins &f{joins}/s &8| &7Verifying &f{verifying} &8| &7Passed &#7CFC8A{passed}/s &8| &7Failed &#FF5C5C{failed}/s &8| &7Blocked &f{blocked}/s &8| {state}"
  enabled: "{prefix}Live statistics &#7CFC8Aenabled&7."
  disabled: "{prefix}Live statistics &#FF5C5Cdisabled&7."
notify:
  title: "&#FF8A1F&lSINTESI"
  subtitle: "&7Sintesi is blocking a bot attack &8(&f{cps} &7cps, &f{blocked} &7blocked/s, &f{failed} &7failed/s&8)"
  started: "{prefix}&#FF5C5CBot attack detected&7: &f{cps} &7connections per second."
  ended: "{prefix}&#7CFC8AAttack ended &7after &f{duration}&7. Peak &f{peak} &7cps, &f{total_blocked} &7connections blocked, &f{total_failed} &7failed verifications."
  enabled: "{prefix}Attack notifications &#7CFC8Aenabled&7."
  disabled: "{prefix}Attack notifications &#FF5C5Cdisabled&7."
webhook:
  started: "**Bot attack detected**: {cps} connections per second. Sintesi is filtering it."
  ended: "**Attack ended** after {duration}. Peak {peak} connections per second, {total_blocked} connections blocked, {total_failed} failed verifications, {total_passed} players verified."
update:
  available: "{prefix}&fSintesi {latest} &7is available, you are running &f{current} &8(&f{behind} &7newer on the &f{channel} &7channel&8)&7. &b{url}"
stats:
  - "&8&m                                                  "
  - "&#FF8A1F&lSINTESI &7statistics &8(&7uptime &f{uptime}&8)"
  - ""
  - " &7State: {state}"
  - " &7Connections: &f{cps}&7/s &8(&7peak &f{peak}&8)"
  - " &7Logins: &f{joins}&7/s  &7Pings: &f{pings}&7/s"
  - " &7Verifying now: &f{verifying}"
  - " &7Verifications: &#7CFC8A{total_passed} passed &8/ &#FF5C5C{total_failed} failed"
  - " &7Blocked connections: &f{total_blocked}"
  - " &7Verified players stored: &f{stored}"
  - " &7Bedrock connections (Geyser, not checked): &f{bedrock}"
  - " &7VPN logins refused: &f{vpn_refused}"
  - " &7Blocklisted addresses: &f{blocklisted}"
  - " &7Supported protocols: &f{protocols}"
  - " &7Last failure: &f{last_failure}"
  - " &7Memory: &f{memory_used} &8/ &f{memory_max} &7MB"
  - "&8&m                                                  "
command:
  help-header:
    - "&8&m                                                  "
    - "&#FF8A1F&lSINTESI &7antibot &8(&7v{version}&8)"
    - ""
  help-line: " &#FF8A1F/sintesi {command} &8» &7{description}"
  help-footer: "&8&m                                                  "
  no-permission: "{prefix}&#FF5C5CYou do not have permission to do that."
  players-only: "{prefix}&#FF5C5COnly players can use this command."
  unknown: "{prefix}Unknown subcommand. Use &#FF8A1F/sintesi help&7."
  usage: "{prefix}Usage: &#FF8A1F/sintesi {usage}"
  reloaded: "{prefix}Configuration and messages &#7CFC8Areloaded&7."
  reload-failed: "{prefix}&#FF5C5CReload failed: &7{error}"
  invalid-address: "{prefix}&#FF5C5C{address} &7is not a valid IP address."
  blocklist-added: "{prefix}Blocked &f{address} &7for &f{minutes} &7minutes."
  blocklist-removed: "{prefix}Unblocked &f{address}&7."
  blocklist-cleared: "{prefix}Cleared &f{count} &7blocked addresses."
  blocklist-size: "{prefix}&f{count} &7addresses are blocked."
  blocklist-help:
    - "{prefix}Blocklist commands:"
    - " &#FF8A1F/sintesi blocklist remove <ip|code> &8» &7lift a block, the code is the one shown to the player (#SINTESI-XXXXXX)"
    - " &#FF8A1F/sintesi blocklist info <ip|code> &8» &7address, reason and time left"
    - " &#FF8A1F/sintesi blocklist add <ip> [minutes] &8» &7block an address"
    - " &#FF8A1F/sintesi blocklist clear &8» &7lift every block"
  blocklist-info: "{prefix}&f{address} &7is blocked for &f{minutes} &7more minutes &8(&7{reason}&8, &7code &f#SINTESI-{code}&8)"
  blocklist-not-found: "{prefix}&f{target} &7is not blocked."
  blocklist-unknown-address: "unknown address"
  blocklist-reason-manual: "added by staff"
  blocklist-reason-failures: "repeated failed verifications"
  blocklist-reason-flood: "connection flood"
  verified-cleared: "{prefix}Removed &f{count} &7verified players. Everyone will be verified again."
  verified-count: "{prefix}&f{count} &7verified players are stored."
  verified-removed: "{prefix}&f{name} &7will be verified again on the next join."
  verified-not-found: "{prefix}&f{name} &7was not verified from that address."
  vpn-status: "{prefix}VPN block mode &f{mode}&7, &f{ranges} &7ranges loaded, &f{refused} &7logins refused."
  vpn-listed: "{prefix}&f{address} &7is on the VPN, proxy or hosting lists and would be refused."
  vpn-not-listed: "{prefix}&f{address} &7is not on the VPN, proxy or hosting lists."
  vpn-unknown-target: "{prefix}&f{target} &7is neither an IP address nor an online player."
  vpn-reloading: "{prefix}Downloading the VPN lists again. The result is written to the console."
  version-up-to-date: "{prefix}Sintesi &f{current} &7is the latest version on the &f{channel} &7channel."
  version-outdated: "{prefix}&fSintesi {latest} &7is available, you are running &f{current}&7. &b{url}"
  version-unknown: "{prefix}Sintesi &f{current}&7. Modrinth could not be reached, try again later."
  version-disabled: "{prefix}Sintesi &f{current}&7. The update checker is turned off in config.yml."
  version-checking: "{prefix}Checking Modrinth for updates."
  player-offline: "{prefix}&f{name} &7is not online. Use &#FF8A1F/sintesi verified remove <name> <ip>&7."
description:
  help: "Show this help"
  stats: "Show detailed statistics"
  verbose: "Toggle live statistics in the action bar"
  notify: "Toggle attack notifications"
  reload: "Reload config.yml and messages.yml"
  blocklist: "Manage blocked addresses, lift a block with /sintesi blocklist remove <ip|code>"
  verified: "Manage verified players (count, clear, remove)"
  vpn: "VPN block status, check an address, download the lists again"
  version: "Show the version and check Modrinth for updates"
